<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Informatics | Pair Generator</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
        }

        body {
            margin: 0; font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; overflow: hidden;
        }

        /* Окно входа */
        #login-overlay {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }

        .login-card {
            background: var(--card-bg); padding: 40px; border-radius: 24px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.2);
            text-align: center; width: 420px; border: 1px solid #334155;
        }

        input {
            width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 12px;
            border: 1px solid #334155; background: #0f172a; color: white; font-size: 1.1rem; box-sizing: border-box;
        }

        .emoji-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
            max-height: 180px; overflow-y: auto; padding: 10px;
            background: #0f172a; border-radius: 12px; margin-bottom: 20px;
        }

        .emoji-btn {
            font-size: 2rem; cursor: pointer; border-radius: 10px; border: 2px solid transparent;
            transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }

        .emoji-btn:hover { background: #1e293b; }
        .emoji-btn.active { border-color: var(--accent); background: #0c4a6e; }
        .emoji-btn.taken { opacity: 0.1; pointer-events: none; filter: grayscale(1); }

        /* Интерфейс */
        .app-container {
            display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box;
        }

        header {
            height: 120px; display: flex; flex-wrap: wrap; gap: 10px;
            justify-content: center; align-content: center;
            background: var(--card-bg); border-radius: 20px; border: 1px solid #334155; margin-bottom: 20px;
        }

        .user-tag {
            background: #334155; padding: 6px 16px; border-radius: 50px;
            display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.9rem;
        }

        #pairs-zone {
            flex-grow: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px; overflow-y: auto; align-content: start;
        }

        .pair-box {
            background: var(--card-bg); border-radius: 24px; height: 160px;
            display: flex; align-items: center; justify-content: space-around;
            border: 1px solid #334155; animation: slideIn 0.4s ease-out;
        }

        .student { text-align: center; }
        .student div:first-child { font-size: 70px; line-height: 1; }
        .student div:last-child { margin-top: 8px; font-weight: bold; color: var(--accent); }

        .divider { font-weight: 900; color: #64748b; font-size: 1.5rem; }

        .btn {
            padding: 16px 40px; background: var(--accent); color: #0f172a;
            border: none; border-radius: 50px; font-weight: 800; cursor: pointer;
            font-size: 1.1rem; transition: 0.3s;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }

        #footer { position: fixed; bottom: 20px; right: 20px; }

        #error-log { color: #f87171; font-size: 0.8rem; margin-top: 10px; display: none; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="margin-top:0">IT Class Login</h2>
        <input type="text" id="username" placeholder="Введите имя ученика...">
        <div class="emoji-grid" id="emoji-picker"></div>
        <button class="btn" style="width: 100%" onclick="connect()">Войти в систему</button>
        <div id="error-log"></div>
    </div>
</div>

<div class="app-container">
    <header id="status-bar">
        <div style="color: #64748b">Ожидание учеников...</div>
    </header>
    <main id="pairs-zone"></main>
</div>

<div id="footer">
    <button class="btn" onclick="distribute()">Разделить на пары</button>
</div>

<script>
    const API_KEY = '37E7Iw.AUJ_Sg:bD62PMW4whMup4RjEE2QsyyOSZRRmWHjPP2SW1d-7jE';
    const EMOJIS = ['🚀', '🤖', '👾', '💎', '🔥', '🌈', '🎨', '🧩', '🎸', '🦖', '🦁', '🐱', '🍕', '🌍', '⚡', '🕶️', '👑', '🏀', '🍀', '🍎', '🦊', '🦄', '🐳', '🚁', '🏆'];
    
    let ably, channel, myInfo = null;

    // Инициализация эмодзи
    const grid = document.getElementById('emoji-picker');
    EMOJIS.forEach(e => {
        const div = document.createElement('div');
        div.className = 'emoji-btn';
        div.innerText = e;
        div.onclick = () => {
            document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
            div.classList.add('active');
            myInfo = { emoji: e };
        };
        grid.appendChild(div);
    });

    async function connect() {
        const name = document.getElementById('username').value.trim();
        const errLog = document.getElementById('error-log');
        
        if (!name || !myInfo) {
            alert("Нужно ввести имя и выбрать эмодзи!");
            return;
        }
        myInfo.name = name;

        try {
            // Подключение
            ably = new Ably.Realtime({ key: API_KEY, transports: ['web_socket'] });
            
            ably.connection.on('failed', (err) => {
                errLog.innerText = "Ошибка: " + err.reason;
                errLog.style.display = "block";
            });

            channel = ably.channels.get('informatics-room-v3');
            
            await channel.presence.enter(myInfo);
            
            // Подписки
            channel.presence.subscribe(() => updatePresence());
            channel.subscribe('draw-pairs', (msg) => renderPairs(msg.data));
            
            updatePresence();
            document.getElementById('login-overlay').style.display = 'none';
            
        } catch (e) {
            errLog.innerText = "Ошибка подключения к серверу Ably.";
            errLog.style.display = "block";
            console.error(e);
        }
    }

    async function updatePresence() {
        const members = await channel.presence.get();
        const bar = document.getElementById('status-bar');
        bar.innerHTML = '';
        
        const btns = document.querySelectorAll('.emoji-btn');
        btns.forEach(b => b.classList.remove('taken'));

        members.forEach(m => {
            if(m.data) {
                bar.innerHTML += `<div class="user-tag"><span>${m.data.emoji}</span>${m.data.name}</div>`;
                btns.forEach(b => {
                    if(b.innerText === m.data.emoji) b.classList.add('taken');
                });
            }
        });
    }

    async function distribute() {
        const members = await channel.presence.get();
        if (members.length < 2) return alert("Нужно минимум 2 ученика!");

        let students = members.map(m => m.data).sort(() => Math.random() - 0.5);
        let pairs = [];
        for (let i = 0; i < students.length; i += 2) {
            pairs.push([students[i], students[i+1] || {name: "Один", emoji: "👤"}]);
        }
        channel.publish('draw-pairs', pairs);
    }

    function renderPairs(data) {
        const zone = document.getElementById('pairs-zone');
        zone.innerHTML = '';
        data.forEach(p => {
            zone.innerHTML += `
                <div class="pair-box">
                    <div class="student"><div>${p[0].emoji}</div><div>${p[0].name}</div></div>
                    <div class="divider">VS</div>
                    <div class="student"><div>${p[1].emoji}</div><div>${p[1].name}</div></div>
                </div>`;
        });
    }
</script>
</body>
</html>
