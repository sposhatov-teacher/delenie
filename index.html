<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Делим учеников на пары</title>
<style>
body { margin:0; font-family:Arial; overflow:hidden; background:#fafafa; }

#topBar {
  height: 28vh;
  overflow:hidden;
  background:#f1f3f6;
  padding:10px;
}

#students {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.student {
  display:flex;
  flex-direction:column;
  align-items:center;
  width:70px;
}

.student .emoji { font-size:40px; }

#controls {
  text-align:center;
  padding:10px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

button {
  font-size:16px;
  padding:10px 16px;
  cursor:pointer;
  border:none;
  border-radius:8px;
}

.primary { background:#4a7dff; color:white; }
.danger { background:#ff4a4a; color:white; }

#pairs {
  height: 40vh;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:16px;
  padding:10px;
}

.pair {
  width:45%;
  border-radius:12px;
  background:white;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
  font-size:20px;
  padding:10px;
}

.bigEmoji { font-size:64px; }

/* MODAL */
#modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#emojiGrid {
  display:grid;
  grid-template-columns: repeat(6, 1fr);
  gap:10px;
  margin-top:20px;
}

.emojiBtn {
  font-size:38px;
  padding:10px;
  border:2px solid #ddd;
  border-radius:10px;
  cursor:pointer;
  background:#fff;
}

.emojiBtn.used {
  opacity:0.3;
  pointer-events:none;
}

input {
  font-size:18px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
</style>
</head>
<body>

<div id="modal">
  <h2>Вход в систему</h2>
  <input id="nameInput" placeholder="Введите имя">
  <h3>Выберите эмодзи</h3>
  <div id="emojiGrid"></div>
</div>

<div id="topBar">
  <h3>👨‍🎓 Ученики онлайн</h3>
  <div id="students"></div>
</div>

<div id="controls">
  <button class="primary" id="pairBtn">Сформировать пары</button>
  <button class="danger" id="clearBtn">Очистить класс</button>
</div>

<div id="pairs"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-1CH2jaOv6rAkeLfLSzohc7e_10mzc4M",
  authDomain: "delenie-real.firebaseapp.com",
  databaseURL: "https://delenie-real-default-rtdb.firebaseio.com",
  projectId: "delenie-real",
  storageBucket: "delenie-real.firebasestorage.app",
  messagingSenderId: "52837234105",
  appId: "1:52837234105:web:4fb7e3c890d0c6bc78b268",
  measurementId: "G-FXGELFCY95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(location.search);
const isTeacher = params.get("role") === "teacher";

if (!isTeacher) document.getElementById("clearBtn").style.display = "none";

const emojis = ["😀","😎","🚀","🔥","🌈","🐱","🐶","🍕","🎮","⚽","🎧","📱","💡","🌟","🧠","🎯","🦄","🍀","🌍","🎲","🧩","📚","🖥️","⌨️","🖱️","🤖","👾","🧸","🎨"];

const emojiGrid = document.getElementById("emojiGrid");
let selectedEmoji = null;

function loadEmojis(){
  onValue(ref(db,"emojis"), snap => {
    const used = snap.val() || {};

    emojiGrid.innerHTML = "";
    emojis.forEach(e => {
      const btn = document.createElement("div");
      btn.className = "emojiBtn";
      btn.innerText = e;

      if (used[e]) btn.classList.add("used");

      btn.onclick = () => selectEmoji(e);
      emojiGrid.appendChild(btn);
    });
  });
}

loadEmojis();

async function selectEmoji(e){
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return alert("Введите имя");

  const snap = await get(ref(db,"emojis/"+e));
  if (snap.exists()) return alert("Эмодзи занято");

  await set(ref(db,"emojis/"+e), true);

  await push(ref(db,"students"), {
    name,
    emoji:e,
    ts:Date.now()
  });

  document.getElementById("modal").style.display="none";
}

onValue(ref(db,"students"), snap => {
  const data = snap.val() || {};
  const box = document.getElementById("students");
  box.innerHTML="";

  Object.values(data).forEach(s => {
    const div = document.createElement("div");
    div.className="student";
    div.innerHTML = `<div class='emoji'>${s.emoji}</div><div>${s.name}</div>`;
    box.appendChild(div);
  });
});

// PAIRS
async function makePairs(){
  const snap = await get(ref(db,"students"));
  let arr = Object.values(snap.val()||{});

  arr.sort(()=>Math.random()-0.5);

  const pairs = [];
  for(let i=0;i<arr.length;i+=2){
    pairs.push([arr[i],arr[i+1]||null]);
  }

  const box = document.getElementById("pairs");
  box.innerHTML="";

  pairs.forEach(p=>{
    const el=document.createElement("div");
    el.className="pair";

    el.innerHTML = `
      <div>
        <div class='bigEmoji'>${p[0].emoji}</div>
        <div>${p[0].name}</div>
      </div>
      <div>
        ${p[1]?`<div class='bigEmoji'>${p[1].emoji}</div><div>${p[1].name}</div>`:""}
      </div>
    `;

    box.appendChild(el);
  });
}

async function clearAll(){
  if(!confirm("Очистить весь класс?")) return;

  await remove(ref(db,"students"));
  await remove(ref(db,"emojis"));
  document.getElementById("pairs").innerHTML="";
}

// EVENTS
if(isTeacher){
  document.getElementById("pairBtn").onclick = makePairs;
  document.getElementById("clearBtn").onclick = clearAll;
}else{
  document.getElementById("pairBtn").onclick = ()=>alert("Только учитель может создавать пары");
  document.getElementById("clearBtn").onclick = ()=>alert("Нет доступа");
}

</script>

</body>
</html>
