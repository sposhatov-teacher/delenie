<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деление на пары - Информатика</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --accent: #007bff; --success: #28a745; }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        
        /* Окно входа */
        #login-overlay { position: fixed; inset: 0; background: white; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        
        .emoji-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; max-height: 200px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 12px; }
        .emoji-item { font-size: 2.2rem; cursor: pointer; border-radius: 10px; transition: 0.2s; display: flex; justify-content: center; border: 2px solid transparent; }
        .emoji-item.selected { border-color: var(--accent); background: #e7f1ff; }
        .emoji-item.taken { opacity: 0.1; pointer-events: none; filter: grayscale(1); }

        /* Сетка */
        .layout { display: flex; flex-direction: column; height: 100vh; padding: 15px; box-sizing: border-box; }
        #user-list { height: 15vh; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center; background: white; border-radius: 20px; margin-bottom: 15px; border: 1px solid #ddd; }
        .user-badge { background: #fff; padding: 5px 15px; border-radius: 50px; display: flex; align-items: center; gap: 8px; font-weight: 600; border: 1px solid #ccc; }

        #pairs-display { flex-grow: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 10px; align-content: center; justify-items: center; overflow-y: auto; }
        .pair-card { background: white; width: 100%; max-width: 380px; height: 180px; border-radius: 25px; display: flex; justify-content: space-evenly; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        
        .unit { text-align: center; }
        .unit .emoji { font-size: 85px; display: block; line-height: 1; }
        .unit .name { font-size: 1.2rem; font-weight: bold; margin-top: 8px; }
        .vs { font-size: 1.5rem; color: #ff4757; font-weight: 900; }

        button { padding: 15px 35px; font-size: 1.2rem; border: none; border-radius: 50px; background: var(--success); color: white; cursor: pointer; font-weight: bold; }
        #admin { position: fixed; bottom: 20px; right: 20px; }
        #status-msg { font-size: 0.8rem; color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h3>Вход в класс</h3>
        <input type="text" id="username" placeholder="Имя ученика" style="width: 80%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 1.1rem;">
        <div class="emoji-picker" id="picker"></div>
        <button onclick="joinClass()">Войти</button>
        <div id="status-msg">Ошибка подключения. Проверьте консоль.</div>
    </div>
</div>

<div class="layout">
    <div id="user-list"></div>
    <div id="pairs-display"></div>
</div>

<div id="admin">
    <button onclick="generatePairs()">Разделить на пары</button>
</div>

<script>
    const API_KEY = '37E7Iw.AUJ_Sg:bD62PMW4whMup4RjEE2QsyyOSZRRmWHjPP2SW1d-7jE';
    const EMOJIS = ['🚀', '🤖', '👾', '💎', '🔥', '🌈', '🎨', '🧩', '🎸', '🦖', '🦁', '🐱', '🍕', '🌍', '⚡', '🕶️', '👑', '🏀', '🍀', '🍎', '🦊', '🦄', '🐳', '🚁', '🏆'];
    
    let ably, channel, myData = null;

    // Пикер
    const picker = document.getElementById('picker');
    EMOJIS.forEach(e => {
        const span = document.createElement('span');
        span.className = 'emoji-item';
        span.innerText = e;
        span.onclick = () => {
            document.querySelectorAll('.emoji-item').forEach(i => i.classList.remove('selected'));
            span.classList.add('selected');
            myData = { emoji: e };
        };
        picker.appendChild(span);
    });

    async function joinClass() {
        const name = document.getElementById('username').value.trim();
        if (!name || !myData) return alert("Выбери имя и эмодзи!");
        myData.name = name;

        try {
            // Исправленная инициализация с принудительным использованием WebSockets
            ably = new Ably.Realtime({ 
                key: API_KEY,
                transports: ['web_socket'] 
            });

            ably.connection.on('failed', () => { document.getElementById('status-msg').style.display = 'block'; });

            channel = ably.channels.get('class-room-final');

            await ably.connection.whenState('connected');
            await channel.presence.enter(myData);

            // Слушаем всех
            channel.presence.subscribe('enter', updateUI);
            channel.presence.subscribe('leave', updateUI);
            channel.presence.subscribe('present', updateUI);
            channel.subscribe('split-pairs', (msg) => { drawPairs(msg.data); });

            updateUI();
            document.getElementById('login-overlay').style.display = 'none';
        } catch (e) {
            console.error(e);
            alert("Критическая ошибка. Проверьте интернет или API ключ.");
        }
    }

    async function updateUI() {
        const members = await channel.presence.get();
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        
        const items = document.querySelectorAll('.emoji-item');
        items.forEach(i => i.classList.remove('taken'));

        members.forEach(m => {
            if (m.data) {
                list.innerHTML += `<div class="user-badge"><span>${m.data.emoji}</span> ${m.data.name}</div>`;
                items.forEach(i => { if (i.innerText === m.data.emoji) i.classList.add('taken'); });
            }
        });
    }

    async function generatePairs() {
        const members = await channel.presence.get();
        if (members.length < 2) return;

        let students = members.map(m => m.data).sort(() => Math.random() - 0.5);
        let pairs = [];
        for (let i = 0; i < students.length; i += 2) {
            pairs.push([students[i], students[i+1] || {name: "Ждет...", emoji: "👤"}]);
        }
        channel.publish('split-pairs', pairs);
    }

    function drawPairs(pairs) {
        const container = document.getElementById('pairs-display');
        container.innerHTML = '';
        pairs.forEach(p => {
            container.innerHTML += `
                <div class="pair-card">
                    <div class="unit">
                        <span class="emoji">${p[0].emoji}</span>
                        <div class="name">${p[0].name}</div>
                    </div>
                    <div class="vs">&</div>
                    <div class="unit">
                        <span class="emoji">${p[1].emoji}</span>
                        <div class="name">${p[1].name}</div>
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
