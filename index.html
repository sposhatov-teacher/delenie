<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деление на пары - Информатика</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --accent: #007bff;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
        }

        /* Окно входа */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: white; padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center; width: 450px;
        }

        .emoji-picker {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 12px; margin: 25px 0;
            max-height: 250px; overflow-y: auto; padding: 10px;
        }

        .emoji-item {
            font-size: 2.5rem; cursor: pointer; border-radius: 15px;
            transition: all 0.2s; border: 2px solid transparent;
        }

        .emoji-item:hover { transform: scale(1.1); background: #f0f0f0; }
        .emoji-item.selected { border-color: var(--accent); background: #e7f1ff; }
        .emoji-item.taken { opacity: 0.2; pointer-events: none; filter: grayscale(1); }

        /* Контент */
        .main-layout {
            display: flex; flex-direction: column; height: 100vh; padding: 15px; box-sizing: border-box;
        }

        #user-list {
            height: 20vh; display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center; align-content: center;
            background: rgba(255,255,255,0.5); border-radius: 20px;
        }

        .user-badge {
            background: white; padding: 10px 20px; border-radius: 15px;
            display: flex; align-items: center; gap: 10px; font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-size: 1.2rem;
        }

        /* Пары */
        #pairs-display {
            flex-grow: 1; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; padding: 20px 0; align-items: center; justify-items: center;
        }

        .pair-card {
            background: white; width: 90%; height: 80%;
            border-radius: 30px; display: flex; justify-content: space-evenly;
            align-items: center; box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            border: 1px solid #eee;
        }

        .student-unit { text-align: center; }
        .student-unit .emoji { font-size: 90px; display: block; }
        .student-unit .name { font-size: 1.4rem; font-weight: bold; margin-top: 10px; }

        .vs-divider { font-size: 2rem; color: #ff4757; font-weight: 900; }

        button {
            padding: 18px 40px; font-size: 1.3rem; border: none; border-radius: 50px;
            background: #28a745; color: white; cursor: pointer;
            transition: 0.3s; font-weight: bold;
        }

        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3); }

        #admin-btn { position: fixed; bottom: 30px; right: 30px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="margin-top:0">Вход в систему</h2>
        <input type="text" id="username" placeholder="Введите имя" 
               style="width: 85%; padding: 15px; border-radius: 15px; border: 2px solid #ddd; font-size: 1.2rem; outline: none;">
        <div class="emoji-picker" id="picker"></div>
        <button onclick="joinClass()" style="width: 100%;">Войти в класс</button>
    </div>
</div>

<div class="main-layout">
    <div id="user-list"></div>
    <div id="pairs-display"></div>
</div>

<div id="admin-btn">
    <button onclick="generatePairs()">Разделить на пары</button>
</div>

<script>
    // --- НАСТРОЙКИ ---
    const API_KEY = '37E7Iw.AUJ_Sg:bD62PMW4whMup4RjEE2QsyyOSZRRmWHjPP2SW1d-7jE'; // ЗАМЕНИТЕ ЭТОТ ТЕКСТ НА ВАШ КЛЮЧ
    const EMOJIS = ['🚀', '🤖', '👾', '💎', '🔥', '🌈', '🎨', '🧩', '🎸', '🦖', '🦁', '🐱', '🍕', '🌍', '⚡', '🕶️', '👑', '🏀', '🍀', '🍎', '🦊', '🦄', '🐳', '🚁', '🏆'];
    
    let ably, channel, myData;

    // Отрисовка выбора эмодзи
    const picker = document.getElementById('picker');
    EMOJIS.forEach(e => {
        const span = document.createElement('span');
        span.className = 'emoji-item';
        span.innerText = e;
        span.onclick = () => {
            document.querySelectorAll('.emoji-item').forEach(i => i.classList.remove('selected'));
            span.classList.add('selected');
            myData = { emoji: e };
        };
        picker.appendChild(span);
    });

    async function joinClass() {
        const name = document.getElementById('username').value.trim();
        if (!name || !myData) return alert("Введите имя и выберите эмодзи!");

        try {
            // Инициализация Ably
            ably = new Ably.Realtime({ key: API_KEY });
            channel = ably.channels.get('informatics-presence');

            // Ждем соединения
            await ably.connection.whenState('connected');
            
            // Входим в систему (Presence)
            myData.name = name;
            await channel.presence.enter(myData);

            // Подписываемся на изменения списка учеников
            channel.presence.subscribe(() => {
                refreshStudents();
            });

            // Подписываемся на событие генерации пар
            channel.subscribe('pairs-event', (msg) => {
                renderPairs(msg.data);
            });

            // Загружаем текущий список
            refreshStudents();

            document.getElementById('login-overlay').style.display = 'none';
        } catch (err) {
            console.error(err);
            alert("Ошибка подключения. Проверьте API ключ в коде.");
        }
    }

    async function refreshStudents() {
        const members = await channel.presence.get();
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        
        // Помечаем занятые эмодзи
        const items = document.querySelectorAll('.emoji-item');
        items.forEach(i => i.classList.remove('taken'));

        members.forEach(m => {
            const s = m.data;
            list.innerHTML += `<div class="user-badge"><span>${s.emoji}</span> ${s.name}</div>`;
            
            // Отмечаем эмодзи как занятые в пикере (для других)
            items.forEach(i => {
                if (i.innerText === s.emoji) i.classList.add('taken');
            });
        });
    }

    async function generatePairs() {
        const members = await channel.presence.get();
        if (members.length < 2) return alert("Нужно хотя бы 2 человека!");

        let students = members.map(m => m.data).sort(() => Math.random() - 0.5);
        let pairs = [];

        for (let i = 0; i < students.length; i += 2) {
            if (students[i + 1]) {
                pairs.push([students[i], students[i + 1]]);
            } else {
                pairs.push([students[i], { name: "Без пары", emoji: "👤" }]);
            }
        }
        // Рассылаем всем результат
        channel.publish('pairs-event', pairs);
    }

    function renderPairs(pairs) {
        const display = document.getElementById('pairs-display');
        display.innerHTML = '';
        pairs.forEach(p => {
            display.innerHTML += `
                <div class="pair-card">
                    <div class="student-unit">
                        <span class="emoji">${p[0].emoji}</span>
                        <div class="name">${p[0].name}</div>
                    </div>
                    <div class="vs-divider">/</div>
                    <div class="student-unit">
                        <span class="emoji">${p[1].emoji}</span>
                        <div class="name">${p[1].name}</div>
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
