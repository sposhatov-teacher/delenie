<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Пары на уроке</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    text-align:center;
    background:#f0f4f8;
}

/* ВХОД */
#login {
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

input {
    padding:10px;
    font-size:18px;
}

.emoji {
    font-size:30px;
    cursor:pointer;
    margin:5px;
}

.selected {
    border:3px solid green;
    border-radius:10px;
}

/* СПИСОК */
#top {
    padding:10px;
    background:#2196f3;
    color:white;
}

/* ПАРЫ */
.big {
    font-size:80px;
}

.pair {
    display:inline-block;
    width:40%;
    margin:10px;
    padding:10px;
    background:white;
    border-radius:15px;
}
</style>
</head>

<body>

<div id="login">
    <h2>Введите имя</h2>
    <input id="name">

    <h3>Выберите эмодзи</h3>
    <div id="emojiList"></div>

    <button onclick="join()">Войти</button>
</div>

<div id="top"></div>

<button onclick="makePairs()">Разделить на пары</button>

<div id="pairs"></div>

<script>
// ⚠️ ВАЖНО: ЗАПОЛНИТЕ ПОЛНОСТЬЮ
const firebaseConfig = {
  apiKey: "AIzaSyDzfFnTc1QibhhXAjMueyM5dSuLOUwPHXo",
  authDomain: "delenie-6358b.firebaseapp.com",
  projectId: "delenie-6358b",
  storageBucket: "delenie-6358b.firebasestorage.app",
  messagingSenderId: "22658752",
  appId: "1:22658752:web:8b2d30c10c42e44a89b725",
  measurementId: "G-GXTFZ9Q1Z6",

  databaseURL: "https://delenie-6358b-default-rtdb.firebaseio.com/" // ОБЯЗАТЕЛЬНО!
  
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ЭМОДЗИ
const emojis = ["😀","😎","🤖","👾","🐱","🐶","🐼","🐸","🦊","🐵","🐯","🐨","🐧","🐤","🦄","🐙","🐢","🦋","🐞","🐬","🦖","🐳","🐝","🐔","🐗"];

let selectedEmoji = null;

// отрисовка эмодзи
function renderEmojiList(used=[]) {
    const div = document.getElementById("emojiList");
    div.innerHTML = "";

    emojis.forEach(e => {
        if (!used.includes(e)) {
            let span = document.createElement("span");
            span.innerText = e;
            span.className = "emoji";

            span.onclick = () => {
                selectedEmoji = e;
                document.querySelectorAll(".emoji").forEach(el=>el.classList.remove("selected"));
                span.classList.add("selected");
            };

            div.appendChild(span);
        }
    });
}

// вход
function join() {
    let name = document.getElementById("name").value.trim();

    if (!name || !selectedEmoji) {
        alert("Введите имя и выберите эмодзи");
        return;
    }

    // уникальный ID (решает проблему одинаковых имён)
    const id = Date.now();

    db.ref("students/" + id).set({
        name,
        emoji: selectedEmoji
    }).then(()=>{
        document.getElementById("login").style.display = "none";
    }).catch(err=>{
        alert("Ошибка подключения к базе: " + err.message);
        console.error(err);
    });
}

// слушаем изменения
db.ref("students").on("value", snapshot => {
    let data = snapshot.val() || {};
    let list = Object.values(data);

    // список сверху
    document.getElementById("top").innerHTML =
        list.map(s => s.emoji + " " + s.name).join(" | ");

    // обновление доступных эмодзи
    renderEmojiList(list.map(s=>s.emoji));
});

// пары
function makePairs() {
    db.ref("students").once("value").then(snapshot => {
        let list = Object.values(snapshot.val() || {});
        list.sort(()=>Math.random()-0.5);

        let html = "";

        for (let i=0;i<list.length;i+=2){
            html += `<div class="pair">`;

            html += `<div class="big">${list[i].emoji}</div>${list[i].name}`;

            if (list[i+1]) {
                html += `<div class="big">${list[i+1].emoji}</div>${list[i+1].name`;
            }

            html += `</div>`;
        }

        document.getElementById("pairs").innerHTML = html;
    });
}

// первичная отрисовка
renderEmojiList();
</script>

</body>
</html>
