<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Пары на уроке PRO</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    text-align:center;
    background: linear-gradient(135deg,#e3f2fd,#ffffff);
}

/* LOGIN */
#login {
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

input, select {
    padding:10px;
    font-size:18px;
    margin:10px;
}

.emoji {
    font-size:36px;
    cursor:pointer;
    margin:5px;
}

/* TOP */
#top {
    background:#1976d2;
    color:white;
    padding:10px;
}

/* QR */
#qr {
    margin:10px;
}

/* BUTTONS */
button {
    padding:12px 25px;
    font-size:18px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    cursor:pointer;
}

/* PAIRS */
#pairs {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.pair {
    width:45%;
    background:white;
    margin:10px;
    padding:15px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* BIG EMOJI (3D эффект) */
.big {
    font-size:100px;
    text-shadow:
        2px 2px 0px #aaa,
        4px 4px 6px rgba(0,0,0,0.3);
}

/* TIMER */
#timer {
    font-size:28px;
    color:#d32f2f;
}
</style>
</head>

<body>

<div id="login">
    <h2>Введите имя</h2>
    <input id="name">

    <h3>Уровень</h3>
    <select id="level">
        <option value="strong">Сильный</option>
        <option value="weak">Слабый</option>
    </select>

    <h3>Выберите эмодзи</h3>
    <div id="emojiList"></div>

    <button onclick="join()">Войти</button>
</div>

<div id="top"></div>

<div id="timer"></div>

<div id="qr"></div>

<div id="teacherPanel" style="display:none;">
    <button onclick="makePairs()">Сформировать пары</button>
    <button onclick="shuffleAgain()">Перемешать</button>
</div>

<div id="pairs"></div>

<script>
// 🔥 ВСТАВЬТЕ СВОЙ CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDzfFnTc1QibhhXAjMueyM5dSuLOUwPHXo",
  authDomain: "delenie-6358b.firebaseapp.com",
  projectId: "delenie-6358b",
  storageBucket: "delenie-6358b.firebasestorage.app",
  messagingSenderId: "22658752",
  appId: "1:22658752:web:8b2d30c10c42e44a89b725",
  measurementId: "G-GXTFZ9Q1Z6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ⚙️ НАСТРОЙКИ
const isTeacher = location.hash === "#teacher";

// ЭМОДЗИ
const emojis = ["😀","😎","🤖","👾","🐱","🐶","🐼","🐸","🦊","🐵","🐯","🐨","🐧","🐤","🦄","🐙","🐢","🦋","🐞","🐬","🦖","🐳","🐝","🐔","🐗"];
let selectedEmoji = null;

// РЕНДЕР ЭМОДЗИ
function renderEmojiList(used=[]) {
    let div = document.getElementById("emojiList");
    div.innerHTML = "";

    emojis.forEach(e=>{
        if (!used.includes(e)) {
            let el = document.createElement("span");
            el.innerText = e;
            el.className="emoji";
            el.onclick = ()=>selectedEmoji=e;
            div.appendChild(el);
        }
    });
}

// ВХОД
function join() {
    let name = document.getElementById("name").value;
    let level = document.getElementById("level").value;

    if (!name || !selectedEmoji) return alert("Заполните всё");

    db.ref("students/"+name).set({
        name, emoji:selectedEmoji, level
    });

    document.getElementById("login").style.display="none";
}

// ОБНОВЛЕНИЕ
db.ref("students").on("value", snap=>{
    let data = snap.val()||{};
    let list = Object.values(data);

    document.getElementById("top").innerHTML =
        list.map(s=>s.emoji+" "+s.name).join(" | ");

    renderEmojiList(list.map(s=>s.emoji));
});

// ПАРЫ (сильный+слабый)
function makePairs() {
    db.ref("students").once("value").then(snap=>{
        let list = Object.values(snap.val()||{});

        let strong = list.filter(s=>s.level==="strong");
        let weak = list.filter(s=>s.level==="weak");

        let pairs = [];

        while (strong.length && weak.length) {
            pairs.push([strong.pop(), weak.pop()]);
        }

        let rest = strong.concat(weak);

        for (let i=0;i<rest.length;i+=2){
            pairs.push([rest[i], rest[i+1]]);
        }

        renderPairs(pairs);
    });
}

// ПЕРЕМЕШАТЬ
function shuffleAgain() {
    makePairs();
}

// РЕНДЕР ПАР
function renderPairs(pairs){
    let html="";
    pairs.forEach(p=>{
        html+=`<div class="pair">`;

        p.forEach(s=>{
            if (!s) return;
            html+=`<div class="big">${s.emoji}</div>${s.name}`;
        });

        html+=`</div>`;
    });

    document.getElementById("pairs").innerHTML=html;
}

// ТАЙМЕР
let time = 30;
if (isTeacher) {
    document.getElementById("teacherPanel").style.display="block";

    let interval = setInterval(()=>{
        document.getElementById("timer").innerText = "Вход: "+time+" сек";
        time--;

        if (time < 0) {
            clearInterval(interval);
            document.getElementById("timer").innerText="Вход завершен";
        }
    },1000);
}

// QR
if (isTeacher) {
    QRCode.toCanvas(document.getElementById("qr"),
        location.href.replace("#teacher",""),
        {width:150});
}
</script>

</body>
</html>
