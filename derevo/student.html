<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой листочек — рефлексия</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fff5ca,#dbf8e8 65%,#d5eff8);font:500 16px 'Segoe UI',Arial,sans-serif;color:#1a403f;display:grid;place-items:center;padding:16px}.card{width:min(510px,100%);background:#fffffff0;border:2px solid #fff;box-shadow:0 22px 65px #32705732;border-radius:30px;padding:28px}.hero{text-align:center;font-size:68px}.head{text-align:center}h1{font-size:clamp(27px,7vw,37px);line-height:1.08;margin:7px 0}p{color:#577471;line-height:1.5}label.caption{display:block;font-weight:800;margin:22px 0 8px}input{width:100%;padding:16px;border:2px solid #c0ded3;border-radius:14px;font:inherit;outline:none}input:focus{border-color:#24966a}.choices{display:grid;gap:11px;margin-top:20px}.choice{display:flex;align-items:center;gap:13px;text-align:left;width:100%;border:2px solid #dceae4;background:#fff;border-radius:17px;padding:13px;cursor:pointer;transition:.16s}.choice.selected{border-color:#177b5d;background:#eaf9ef;box-shadow:0 0 0 3px #66be8440}.leaf{width:54px;height:38px;flex:0 0 54px;border-radius:90% 0 90% 0;transform:rotate(-25deg);box-shadow:inset 5px 5px 5px #ffffff70,0 3px 7px #20392a35}.leaf.green{background:#4aba71}.leaf.yellow{background:#f3cb45}.leaf.pink{background:#ed869f}.choice b{font-size:16px}.choice small{display:block;color:#63817d;margin-top:3px;font-size:13px}.send{margin-top:22px;width:100%;border:0;border-radius:15px;color:#fff;background:linear-gradient(110deg,#18805c,#36ad79);font:800 18px 'Segoe UI';padding:17px;cursor:pointer}.send:disabled{opacity:.55;cursor:not-allowed}.feedback{margin-top:15px;padding:10px;border-radius:10px;text-align:center;font-size:14px}.error{background:#ffe9e9;color:#aa4141}.success{text-align:center;padding:20px 0}.success .hero{font-size:90px}.hidden{display:none}.footer{text-align:center;color:#77908b;font-size:12px;margin-top:20px}</style></head><body><div class="card"><div id="form"><div class="hero">🌳</div><div class="head"><h1>Мой листочек достижений</h1><p>Как вы оцениваете свою работу на сегодняшнем уроке?</p></div><label class="caption" for="name">Ваше имя</label><input id="name" maxlength="55" placeholder="Например, Айлин" autocomplete="name"><label class="caption">Выберите листочек</label><div class="choices"><button class="choice" data-choice="green"><i class="leaf green"></i><span><b>Зелёный</b><small>Я всё понял(а) и могу объяснить другому</small></span></button><button class="choice" data-choice="yellow"><i class="leaf yellow"></i><span><b>Жёлтый</b><small>Я понял(а), но мне нужна практика</small></span></button><button class="choice" data-choice="pink"><i class="leaf pink"></i><span><b>Розовый</b><small>Мне нужна помощь, чтобы разобраться</small></span></button></div><button id="send" class="send">🍃 Добавить листочек на дерево</button><div id="feedback" class="feedback hidden"></div></div><div id="success" class="success hidden"><div class="hero">🌿</div><h1>Ваш листочек на дереве!</h1><p>Спасибо за ответ. Посмотрите на экран учителя — ваш листочек уже появился.</p><button class="send" id="change">Изменить свой выбор</button></div><div class="footer">Автор Пошатов С.Г.</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyC-1CH2jaOv6rAkeLfLSzohc7e_10mzc4M",authDomain:"delenie-real.firebaseapp.com",databaseURL:"https://delenie-real-default-rtdb.firebaseio.com",projectId:"delenie-real",storageBucket:"delenie-real.firebasestorage.app",messagingSenderId:"52837234105",appId:"1:52837234105:web:4fb7e3c890d0c6bc78b268"};
const db=firebase.initializeApp(firebaseConfig).database();
const param=new URLSearchParams(location.search);
const room=param.get('room')||localStorage.getItem('tree_room')||createRoom();
function createRoom(){let x=crypto.randomUUID().replaceAll('-','');localStorage.setItem('tree_room',x);return x}
const validRoom=/^[A-Za-z0-9]{12,48}$/.test(room);
const votes=()=>db.ref('reflectionTree/v1/sessions/'+room+'/responses');

let selected=null;const $=id=>document.getElementById(id);const deviceStorage='tree_device_'+room;let device=localStorage.getItem(deviceStorage);if(!device){device=crypto.randomUUID().replaceAll('-','');localStorage.setItem(deviceStorage,device)}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.choice;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))}));
function show(t){$('feedback').textContent=t;$('feedback').className='feedback error'}
$('send').onclick=async()=>{if(!validRoom){show('Неверная ссылка урока');return}const name=$('name').value.trim().replace(/\s+/g,' ');if(name.length<2){show('Введите имя (не менее двух символов)');return}if(!selected){show('Выберите цвет листочка');return}$('send').disabled=true;try{await votes().child(device).set({name,choice:selected,createdAt:firebase.database.ServerValue.TIMESTAMP});$('form').classList.add('hidden');$('success').classList.remove('hidden')}catch(e){show('Не удалось сохранить ответ. Проверьте соединение и правила Firebase.')}finally{$('send').disabled=false}};
$('change').onclick=()=>{$('success').classList.add('hidden');$('form').classList.remove('hidden')};
if(validRoom){votes().child(device).once('value').then(s=>{let v=s.val();if(v){$('name').value=v.name||'';selected=v.choice;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.dataset.choice===selected));$('form').classList.add('hidden');$('success').classList.remove('hidden')}}).catch(()=>{})}else show('Неверная ссылка урока');
</script></body></html>
